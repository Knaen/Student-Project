<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Backend Admin Panel</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <!-- Sidebar -->
    <div class="sidebar">
        <h2>Admin</h2>
        <ul>
            <li>Dashboard</li>
            <li>Users</li>
            <li>Products</li>
            <li>Orders</li>
            <li>Settings</li>
        </ul>
    </div>

    <!-- Main -->
    <div class="main">

        <div class="header">
            <h1>Dashboard</h1>
            <button>Logout</button>
        </div>

        <!-- Cards -->
        <div class="cards">
            <div class="card">Users<br><span>120</span></div>
            <div class="card">Orders<br><span>75</span></div>
            <div class="card">Revenue<br><span>$5600</span></div>
            <div class="card">Errors<br><span>3</span></div>
        </div>

        <!-- Table -->
        <div class="table-section">
            <h2>Recent Users</h2>
            <table>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                </tr>
                <tr>
                    <td>1</td>
                    <td>Amin</td>
                    <td>amin@mail.com</td>
                </tr>
                <tr>
                    <td>2</td>
                    <td>Ali</td>
                    <td>ali@mail.com</td>
                </tr>
            </table>
        </div>

    </div>
</div>

</body>
</html>
